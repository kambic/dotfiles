# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
# map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
# map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id


# ────────────────────────────────────────────────────────────
# FONT
# ────────────────────────────────────────────────────────────

font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto

font_size 13

# Enable modern programming ligatures
disable_ligatures never


# ────────────────────────────────────────────────────────────
# WINDOW
# ────────────────────────────────────────────────────────────

# Keep KDE native title bar and window controls
hide_window_decorations no

# Balanced spacing for high-resolution displays
window_padding_width 14
window_padding_height 10

# Fully opaque background
background_opacity 0.9
dynamic_background_opacity yes


# ────────────────────────────────────────────────────────────
# CORE COLORS
# ────────────────────────────────────────────────────────────

# Deep graphite — professional and low-fatigue
background #2B2F36
foreground #DCE1E8

# Cursor — restrained cyan accent
cursor #7DD3E8
cursor_text_color #2B2F36

# Selection
selection_background #4B5565
selection_foreground #F8FAFC

# URLs
url_color #7DD3E8


# ────────────────────────────────────────────────────────────
# ANSI PALETTE
# ────────────────────────────────────────────────────────────

# Black
color0  #181B20
color8  #626B78

# Red
color1  #E66A73
color9  #F28B93

# Green
color2  #9CCB83
color10 #B4E29A

# Yellow
color3  #D8BC72
color11 #E8D18B

# Blue
color4  #6F9FEF
color12 #8EB6FF

# Magenta
color5  #B88BE8
color13 #CEA9F5

# Cyan
color6  #59C7D8
color14 #7DD3E8

# White
color7  #CBD1DA
color15 #F5F7FA


# ────────────────────────────────────────────────────────────
# CURSOR
# ────────────────────────────────────────────────────────────

cursor_shape block

cursor_blink_interval 0.5
cursor_stop_blinking_after 15


# ────────────────────────────────────────────────────────────
# TAB BAR
# ────────────────────────────────────────────────────────────

# Tabs at the top — KDE / Konsole style
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline

# Active tab
active_tab_foreground #F8FAFC
active_tab_background #3D444F

# Inactive tabs
inactive_tab_foreground #8E97A5
inactive_tab_background #252930

# Tab bar background
tab_bar_background #20242A


# ────────────────────────────────────────────────────────────
# SCROLLBACK
# ────────────────────────────────────────────────────────────

scrollback_lines 15000


# ────────────────────────────────────────────────────────────
# CLIPBOARD
# ────────────────────────────────────────────────────────────

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# ────────────────────────────────────────────────────────────
# TABS
# ────────────────────────────────────────────────────────────
map ctrl+t new_tab_with_cwd
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Direct tab navigation
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9


# ────────────────────────────────────────────────────────────
# WINDOWS / SPLITS
# ────────────────────────────────────────────────────────────

map ctrl+shift+enter new_window

# Vim-style split navigation
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right


# ────────────────────────────────────────────────────────────
# FONT SIZE
# ────────────────────────────────────────────────────────────

map ctrl+shift+equal change_font_size all +1
map ctrl+shift+minus change_font_size all -1
map ctrl+shift+backspace change_font_size all 0


# ────────────────────────────────────────────────────────────
# SEARCH
# ────────────────────────────────────────────────────────────

map ctrl+shift+f show_scrollback


# ────────────────────────────────────────────────────────────
# BELL
# ────────────────────────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0
bell_on_tab yes


# ────────────────────────────────────────────────────────────
# PERFORMANCE
# ────────────────────────────────────────────────────────────

repaint_delay 10
input_delay 3
sync_to_monitor yes


# ────────────────────────────────────────────────────────────
# KDE / LINUX
# ────────────────────────────────────────────────────────────

# Close immediately without confirmation
confirm_os_window_close 0

# Standard KDE mouse behavior
focus_follows_mouse no

# Kitty shell integration
shell_integration enabled


# Shell integration
shell_integration enabled
allow_remote_control yes
listen_on unix:@kitty_z4g4

kitty_mod ctrl+shift

map kitty_mod+e combine : new_window : next_layout

action_alias launch_tab launch --type=tab --cwd=current

map f2 launch_tab htop

map ctrl+alt+enter launch --cwd=current

map ctrl+a new_window_with_cwd

